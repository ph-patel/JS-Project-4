<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Object Prototypes | Home Page</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<style>
	img{
		height: 150px;
		width: auto;
		float:right;
	}
	article{
		border-bottom: solid 2px black;
	}
	</style>
</head>

<body>
	<header>

	</header>
	<section>

	</section>
	<script>
		var header = document.querySelector('header');
		var section = document.querySelector('section');
		var requestURL = 'https://github.com/devpriyesh/JavaScript-Project-4-/blob/master/sale.json';
		var request = new XMLHttpRequest();
		request.open('GET', requestURL);
		request.responseType = 'json';
		request.send();
		request.onload = function() {
			var topDeals = request.response;
			console.log(topDeals);
			populateHeader(topDeals);
			topDealss(topDeals);
		}
		function populateHeader(jsonObj){
			var headerH1 = document.createElement('h1');
			headerH1.textContent = jsonObj['HeadOffice'];
			header.appendChild(headerH1);
			var headerPara = document.createElement('p');
			headerPara.textContent = 'Head Office: ' + jsonObj['HeadOffice'] + ', Located At: ' + jsonObj['HeadOfficeLocation'];
			header.appendChild(headerPara);
		}
		function topDealss(jsonObj){
			var topProducts = jsonObj['topDeals'];
			for (var i = 0; i < topProducts.length; i++) {
				var article = document.createElement('article');
				var h2 = document.createElement('h2');
				var img = document.createElement('img');
				var p1 = document.createElement('p');
				var p2 = document.createElement('p');
				var list = document.createElement('ul');
				img.setAttribute('src', 'https://purva18.github.io/Project_4/images/' + topProducts[i].image);
				img.setAttribute('alt', topProducts[i].name);
				h2.textContent = topProducts[i].name;
				p1.textContent = 'Price: $' + topProducts[i].price;
				p2.textContent = 'description: ' + topProducts[i].description;
				var fectures = topProducts[i].fectures;
				for (var j = 0; j < fectures.length; j++) {
					var listItem = document.createElement('li');
					listItem.textContent = fectures[j];
					list.appendChild(listItem);
				}

				article.appendChild(img);
				article.appendChild(h2);
				article.appendChild(p1);
				article.appendChild(p2);
				article.appendChild(list);
				section.appendChild(article);
				}
			}
	
		</script>
	</body>
</html>
