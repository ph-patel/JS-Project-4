<!DOCTYPE html>
<html>
<head>
	<title>Bamazon | Project 4</title>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>

</head>

<body>

	<div class="container">
	
		    <div class="content">
			    <header>
                        <nav class="navbar navbar-light" style="background-color: #f06000;">
                              <span class="navbar-brand mb-0 h1" style="color:white;">Bamazon Application Form</span>
                         </nav>
			    </header>


			<section>
				<h4 class="text-center mt-3 mb-3">Customer Information</h1>
				<form action="sale.html" method="post">

						<div class="form-group">

								<input type="text" name="firstname" id ="name" class="form-control" placeholder="Input Name" required="firstName"> 

								
							  </div>
				
						<div class="form-group">
							<input type="number" name="age" class="form-control"  placeholder="Input Age" min="1" max="100"
							step="1" required pattern="\d+" id="age">
						</div>
				
						<div class="form-group">
		                    <input type="text" name="city" class="form-control"  placeholder="Input Location" required="locations"
							id="loc">
						</div>
					
						<div class="form-group">
							<input type="email" name="email" class="form-control" placeholder="Input Email" id="mailID" required="email">
						</div>
				
					<input value="submit" name="submit" type="submit" class="submit btn btn-secondary font-weight-bolder btn-lg" style="background-color: #e8200e;"></input>
			
				</form>
				
			</section>
		</div>
	</div>
	
	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>



<script type="text/javascript" src="main.js">
</script>
</body>
</html>
